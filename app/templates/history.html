<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <title>Analysis History | FoodIntellect</title>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>

<body>
    <main class="app-shell page-shell">
        <header class="page-header">
            <a class="back-link" href="/">← Home</a>
            <span class="eyebrow">YOUR ACTIVITY</span>
            <h1>Analysis history</h1>
            <p>Revisit products you've analyzed before.</p>
        </header>

        <section class="panel history-panel">
            <div class="panel-title">
                <span class="card-icon icon-teal" aria-hidden="true">◷</span>
                <div>
                    <h2>Recent analyses</h2>
                    <p>Your saved product analysis records.</p>
                </div>
            </div>
            <div id="history" class="history-list">
                <div class="loading-state"><span class="loading-dot"></span> Loading your history…</div>
            </div>
        </section>
        <footer class="app-footer">FoodIntellect <span>•</span> Your food journey at a glance</footer>
    </main>

    <script>
        const userId = 1;

        async function loadHistory() {

            const response =
                await fetch(
                    `/api/user/history/${userId}`
                );

            const data =
                await response.json();

            const container =
                document.getElementById("history");

            if (
                !data.history ||
                data.history.length === 0
            ) {

                container.innerHTML =
                    "<p>No analysis history found.</p>";

                return;
            }

            let html = "";

            data.history.forEach(item => {

                html += `

            <div class="history-card">

                <h3>
                    ${item.product_name}
                </h3>

                <p>
                    Barcode:
                    ${item.barcode || "N/A"}
                </p>

                <p>
                    Date:
                    ${item.created_at}
                </p>

            </div>

        `;

            });

            container.innerHTML = html;

        }

        loadHistory();
    </script>
</body>

</html>
