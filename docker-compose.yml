version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: foodintellect-db
    restart: always
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-rag_bootcamp}
      - POSTGRES_USER=${DB_USER:-rag_app_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-rag_password}
    volumes:
      - foodintellect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag_app_user} -d ${DB_NAME:-rag_bootcamp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: foodintellect-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - .:/app

volumes:
  foodintellect_pgdata:
